<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>matt.json — Developer/Designer</title>
    <style>
      :root {
        --bg: #0e1116;
        --surface: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #5eead4;
        --border: #262c36;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.6;
        font-size: 1rem;
      }

      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: clamp(2rem, 6vw, 4.5rem) clamp(1.25rem, 5vw, 2rem);
      }

      /* Header */
      header {
        margin-bottom: clamp(2.5rem, 8vw, 4rem);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 9vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .role {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 3.5vw, 1.2rem);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .role::before {
        content: "";
        display: inline-block;
        width: 1.75rem;
        height: 2px;
        margin-right: 0.6rem;
        vertical-align: middle;
        background: var(--accent);
      }

      /* Projects */
      main {
        display: flex;
        flex-direction: column;
        gap: clamp(1.25rem, 4vw, 1.75rem);
      }

      .section-label {
        margin: 0 0 0.5rem;
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: clamp(1.5rem, 5vw, 2rem);
        transition: border-color 0.18s ease, transform 0.18s ease;
      }

      .card:hover,
      .card:focus-within {
        border-color: var(--accent);
        transform: translateY(-2px);
      }

      .card h2 {
        margin: 0;
        font-size: clamp(1.25rem, 5vw, 1.5rem);
        font-weight: 700;
      }

      .card p {
        margin: 0.6rem 0 1.1rem;
        color: var(--muted);
      }

      .card a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      .card a::after {
        content: "\2192"; /* → */
        transition: transform 0.18s ease;
      }

      .card a:hover::after,
      .card a:focus-visible::after {
        transform: translateX(4px);
      }

      /* Footer */
      footer {
        margin-top: clamp(2.5rem, 8vw, 4rem);
        padding-top: clamp(1.5rem, 5vw, 2rem);
        border-top: 1px solid var(--border);
      }

      .contacts {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 2rem;
      }

      .contacts a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      .contacts a:hover {
        text-decoration: underline;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 3px;
      }

      @media (max-width: 420px) {
        .contacts {
          flex-direction: column;
          gap: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>matt.json</h1>
        <p class="role">Developer/Designer</p>
      </header>

      <main>
        <p class="section-label">Projects</p>

        <article class="card">
          <h2>ClockIn</h2>
          <p>A gamified logbook website.</p>
          <a href="#">View project</a>
        </article>

        <article class="card">
          <h2>Komsai Week</h2>
          <p>CS week, 30th anniversary edition.</p>
          <a href="#">View project</a>
        </article>

        <article class="card">
          <h2>Expo30</h2>
          <p>A software engineering expo website.</p>
          <a href="#">View project</a>
        </article>
      </main>

      <footer>
        <p class="section-label">Get in touch</p>
        <nav class="contacts">
          <a href="mailto:you@example.com">Email</a>
          <a href="https://github.com/your-username">GitHub</a>
          <a href="https://www.linkedin.com/in/your-profile">LinkedIn</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
